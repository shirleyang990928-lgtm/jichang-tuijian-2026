name: daily-refresh
on:
  schedule:
    - cron: '30 0 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bump last-updated date (Asia/Shanghai)
        run: |
          D=$(TZ=Asia/Shanghai date +%F)
          sed -i "s#<!--DATE-->.*<!--/DATE-->#<!--DATE-->$D<!--/DATE-->#" README.md
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --cached --quiet || git commit -m "chore: 每日同步 $(TZ=Asia/Shanghai date +%F)"
          git push
